name: tests

on: pull_request

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LANGSMITH_TRACING: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install OCR language data
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr-eng
          echo "TESSDATA_PREFIX=$(dirname "$(dpkg -L tesseract-ocr-eng | grep '/eng.traineddata$')")" >> "$GITHUB_ENV"

      - name: Check OCR language data
        run: |
          test -f "$TESSDATA_PREFIX/eng.traineddata" || { echo "eng.traineddata not found in $TESSDATA_PREFIX: the OCR tests would skip"; exit 1; }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      # Plain clone, so only the tracked pilot sidecars exist (#290)
      - name: Run pytest
        run: python3 -m pytest -q -rs
